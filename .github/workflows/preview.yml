name: Review app

# Builds every pull request and, when Cloudflare credentials are configured,
# deploys it to its own Worker (church-pr-<number>) and comments the URL.
# The Worker is deleted when the PR is closed.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: review-app-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  WORKER_NAME: church-pr-${{ github.event.number }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Check whether deploy is configured
        id: cfg
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: set secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SUPABASE_SERVICE_ROLE_KEY and variable SUPABASE_URL."
          fi

      # ---- PR closed: remove the review app ----
      - name: Delete review app
        if: github.event.action == 'closed' && steps.cfg.outputs.deploy == 'true'
        run: npx wrangler delete --name "$WORKER_NAME" --force || true

      # ---- PR open/updated: build, (optionally) deploy ----
      - name: Lint (existing API routes still have lint errors, so this does not block)
        if: github.event.action != 'closed'
        continue-on-error: true
        run: npm run lint

      - name: Build
        if: github.event.action != 'closed'
        run: npm run build

      - name: Prepare preview config (Supabase instead of D1)
        if: github.event.action != 'closed' && steps.cfg.outputs.deploy == 'true'
        run: |
          jq --arg name "$WORKER_NAME" --arg url "$SUPABASE_URL" \
            '.name=$name | .topLevelName=$name | .d1_databases=[] | .vars.SUPABASE_URL=$url' \
            dist/server/wrangler.json > dist/server/wrangler.preview.json

      - name: Deploy
        id: deploy
        if: github.event.action != 'closed' && steps.cfg.outputs.deploy == 'true'
        run: |
          npx wrangler deploy --config dist/server/wrangler.preview.json | tee deploy.log
          url=$(grep -o 'https://[^ ]*\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set Supabase key as a Worker secret
        if: github.event.action != 'closed' && steps.cfg.outputs.deploy == 'true'
        run: printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name "$WORKER_NAME"

      - name: Comment review app URL
        if: github.event.action != 'closed' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        env:
          APP_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- review-app -->';
            const body = `${marker}\n**Review app:** ${process.env.APP_URL}/dashboard.html\n\nCommit \`${context.payload.pull_request.head.sha.slice(0, 7)}\`. It uses the shared preview Supabase project, not production. It is deleted when this PR closes.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
